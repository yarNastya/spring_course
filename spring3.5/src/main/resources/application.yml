spring:
  application:
    name: library
  datasource:
    url: jdbc:h2:mem:testdb;MODE=LEGACY
#  h2:
#    console:
#      path: /h2-console
#      settings:
#        web-allow-others: true
  liquibase:
    enabled: true
  shell:
    script:
      enabled: true
    interactive:
      enabled: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true

jwt:
  secret: "my_library_application_auth_secret"
  expiration-ms: 3600000
